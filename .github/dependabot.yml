version: 2
updates:
  - package-ecosystem: bundler
    directory: /
    target-branch: deploy
    schedule:
      interval: weekly
    groups:
      ruby-dependencies:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /
    target-branch: deploy
    schedule:
      interval: weekly
    groups:
      lint-dependencies:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    target-branch: deploy
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
