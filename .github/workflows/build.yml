# Shared validation and artifact build used by PR checks and deployment.
# Action hashes pin exact code; release comments keep versions readable.
# Dependabot proposes pin updates instead of action tags changing between runs.
name: Build Jekyll Site

on:
  workflow_call:
    outputs:
      publish_base:
        description: Commit on master containing the CV validated in this build
        value: ${{ jobs.build.outputs.publish_base }}

permissions:
  contents: read

jobs:
  build:
    # Keep the runner OS stable when GitHub changes ubuntu-latest.
    runs-on: ubuntu-24.04
    env:
      BUNDLE_FROZEN: 'true'
    outputs:
      publish_base: ${{ steps.sync_cv.outputs.publish_base }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1
        with:
          bundler-cache: true

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install lint dependencies
        run: npm ci

      # Validate the master CV as a build input instead of replacing it afterwards.
      # Export its commit so publication can reject an intervening master update.
      - name: Sync independently published CV before validation
        id: sync_cv
        run: |
          git fetch --no-tags --depth=1 origin master
          publish_base=$(git rev-parse FETCH_HEAD)
          bin/sync-cv "$publish_base"
          printf 'publish_base=%s\n' "$publish_base" >> "$GITHUB_OUTPUT"

      - name: Validate and build site
        run: bin/check

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: _site/
          # Publish the explicit Dependabot config to the default branch.
          include-hidden-files: true
