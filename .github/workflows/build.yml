# Shared validation and artifact build used by PR checks and deployment.
name: Build Jekyll Site

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUNDLE_FROZEN: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install lint dependencies
        run: npm ci

      - name: Validate and build site
        run: bin/check

      - name: Fetch PDF from master
        run: |
          git fetch origin master
          git checkout origin/master -- otherFiles/MichaelSobrepera.pdf || true
          if [ -f otherFiles/MichaelSobrepera.pdf ]; then
            cp otherFiles/MichaelSobrepera.pdf _site/otherFiles/
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site/
