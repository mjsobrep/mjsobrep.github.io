# Shared validation and artifact build used by PR checks and deployment.
name: Build Jekyll Site

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    # Keep the runner OS stable when GitHub changes ubuntu-latest.
    runs-on: ubuntu-24.04
    env:
      BUNDLE_FROZEN: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          bundler-cache: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install lint dependencies
        run: npm ci

      - name: Sync independently published CV before validation
        run: |
          git fetch --no-tags --depth=1 origin master
          bin/sync-cv FETCH_HEAD

      - name: Validate and build site
        run: bin/check

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: _site/
          # Publish the explicit Dependabot config to the default branch.
          include-hidden-files: true
