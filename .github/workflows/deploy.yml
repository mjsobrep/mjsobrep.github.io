# Publish the validated artifact after source changes reach deploy.
# Action hashes pin exact code; release comments identify the selected versions.
name: Build and Deploy Jekyll Site

on:
  push:
    branches:
      - deploy

permissions:
  contents: read

concurrency:
  group: pages-deployment
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml

  deploy:
    needs: build
    if: github.ref == 'refs/heads/deploy'
    # Use the same tested runner OS as the build job.
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout publishing script and configure Git credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: _site

      - name: Deploy to master branch
        env:
          PUBLISH_BASE: ${{ needs.build.outputs.publish_base }}
        run: bin/publish-site _site "$PUBLISH_BASE"
