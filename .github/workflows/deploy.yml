# Publish the validated artifact after source changes reach deploy.
name: Build and Deploy Jekyll Site

on:
  push:
    branches:
      - deploy
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-deployment
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml

  deploy:
    needs: build
    if: github.ref == 'refs/heads/deploy'
    # Use the same tested runner OS as the build job.
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: _site

      - name: Deploy to master branch
        uses: peaceiris/actions-gh-pages@1ef5a1b1df4c63fe21a2242edbee6cac921ece01 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: master
          # The artifact intentionally includes only .github/dependabot.yml.
          exclude_assets: ''
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'automated commit to publish from github actions'
