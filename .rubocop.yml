# Correctness checks for site plugins, tests, and Rake tasks.
AllCops:
  NewCops: disable
  TargetRubyVersion: 3.2
  Include:
    - '_plugins/**/*.rb'
    - 'test/**/*.rb'
    - 'Rakefile'
  Exclude:
    - 'vendor/**/*'
    - '_site/**/*'
    - 'node_modules/**/*'
  DisabledByDefault: true
  SuggestExtensions: false

Lint:
  Enabled: true
