{% if include.tags %}
<!-- borrowed from http://www.realcombiz.com/2014/01/how-to-expand-collapse-toggle-div-layer.html -->
<input class="toggle-box" id="header1" type="checkbox" >
<label for="header1">Tags</label>
<div>
<ul class="tag">
{% for tag in include.tags %}
  {% assign t = tag | first %}
  <li class="tag"><a href="{{ site.baseurl }}/tags/{{t | tag_slug}}.html" class = "tag">{{t}}</a></li>
{% endfor %}
</ul>
</div>
{% endif %}
